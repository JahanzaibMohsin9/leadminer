[package]
name = "leadminer-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.1", features = ["napi4", "async", "tokio_rt"] }
napi-derive = "2.16.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

# Async runtime
tokio = { version = "1.35", features = ["sync", "time", "rt", "rt-multi-thread"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Cryptography for license validation
sha2 = "0.10"
rsa = "0.9"
rand = "0.8"
base64 = "0.21"

# Error handling
thiserror = "1.0"

# High-performance synchronization
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# System information for hardware fingerprinting
sysinfo = "0.30"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }
